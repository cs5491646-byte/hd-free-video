<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 HD VIDEOS POV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding-top: 85px;
        }

        /* 🔍 LUPA FIXA NO TOPO - NUNCA SUMIR */
        .header-fixo {
            position: fixed !important;
            top: 0 !important;
            left: 0;
            width: 100%;
            background: #000000;
            border-bottom: 1px solid #111;
            padding: 10px 15px;
            z-index: 9999 !important;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .titulo-app {
            color: #0084ff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-container {
            display: flex !important;
            align-items: center;
            background: #111;
            border-radius: 25px;
            padding: 8px 15px;
            border: 1px solid #222;
        }

        .search-bar {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .lupa-icone {
            color: #888;
            margin-right: 8px;
            font-size: 16px;
        }

        /* 🎬 VITRINE DE VÍDEOS VERTICAIS (3 LADO A LADO / 1 POR LINHA NO CELULAR) */
        .vitrine-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .vitrine-container {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        .video-card {
            background: #0c1210;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #161d1a;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-player {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            background: #000;
        }

        .video-titulo {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .video-desc {
            font-size: 13px;
            color: #aaa;
            line-height: 1.4;
        }

        .video-preco {
            color: #00ff7f;
            font-weight: bold;
            font-size: 18px;
            margin-top: auto;
        }

        .btn-comprar {
            background: #0084ff;
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }

        /* 🔐 JANELA DO PIX */
        .overlay-pix {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
        }

        .modal-pix {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1210;
            border: 2px solid #00ff7f;
            border-radius: 16px;
            padding: 22px;
            z-index: 10001;
            text-align: center;
            width: 90%;
            max-width: 380px;
            color: #fff;
        }

        .modal-pix textarea {
            width: 100%;
            height: 80px;
            background: #000;
            color: #00ff7f;
            border: 1px solid #222;
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            margin: 12px 0;
            resize: none;
            outline: none;
        }

        .btn-copiar {
            background: #00ff7f;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn-verificar {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .tela-sucesso {
            display: none;
        }

        .btn-sucesso-whatsapp {
            background: #25d366;
            color: #fff;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

    </div>
