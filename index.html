<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 HD VIDEOS POV</title>
    <style>
        /* ESTILO VISUAL GERAL (TEMA ESCURO PREMIUM) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; /* Bloqueia seleção de textos e cópias */
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 15px;
            padding-bottom: 50px;
        }

        .titulo-pagina {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #32bcad;
            margin-top: 10px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* 1. BARRA DE PESQUISA COM LUPA */
        .container-pesquisa {
            width: 100%;
            margin-bottom: 20px;
        }

        .campo-pesquisa {
            display: flex;
            align-items: center;
            background: #121212;
            border: 1px solid #222;
            border-radius: 25px;
            padding: 12px 15px;
        }

        .campo-pesquisa span {
            font-size: 18px;
            margin-right: 10px;
        }

        #input-buscar {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            width: 100%;
            outline: none;
        }

        #input-buscar::placeholder {
            color: #555555;
        }

        /* CONTAINER DOS PRODUTOS */
        .grade-produtos {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* 2. CARD DO PRODUTO */
        .card-produto {
            background: #0b0b0b;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #161616;
        }

        /* PLAYER DE VÍDEO VERTICAL (9:16) */
        .video-container {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }

        video {
            width: 100%;
            max-width: 100%;
            aspect-ratio: 9 / 16; /* Força o formato vertical estilo Reels */
            object-fit: cover;    /* Preenche perfeitamente a janela */
            background-color: #000;
            pointer-events: none; /* Evita cliques diretos e arrastes no vídeo */
        }

        /* DETALHES DO PRODUTO */
        .detalhes h3 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .detalhes p {
            font-size: 13px;
            color: #888888;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .preco {
            font-size: 22px;
            font-weight: bold;
            color: #00ff7f; /* Verde Neon */
            display: block;
            margin-bottom: 15px;
        }

        /* SISTEMA DE CHECKOUT E BOTÕES */
        .checkout-pix {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1a1a1a;
        }

        .instrucao-pix {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 500;
        }

        .input-pix {
            width: 100%;
            padding: 10px;
            background: #000;
            color: #fff;
            border: 1px solid #222;
            border-radius: 6px;
            margin-bottom: 8px;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
        }

        .btn-copiar, .btn-paguei {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-bottom: 8px;
        }

        .btn-copiar {
            background: #222;
            color: #fff;
        }

        .btn-paguei {
            background: #32bcad; /* Azul Pix */
            color: #fff;
            margin-bottom: 0;
        }

        /* TELA DE SUCESSO E CÓDIGO SECRETO */
        .tela-sucesso {
            text-align: center;
            padding: 15px 5px;
            background: #0c1210;
            border-radius: 12px;
            border: 1px dashed #32bcad;
        }

        .codigo-secreto-exibir {
            background: #000;
            color: #00ff7f;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #111;
            display: inline-block;
            margin: 15px 0;
            letter-spacing: 1px;
        }

        .btn-whatsapp-suporte {
            display: block;
            background: #25d366; /* Verde WhatsApp */
            color: #fff;
            text-decoration: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- TÍTULO FIXO DO MINI APP -->
    <h1 class="titulo-pagina">PRODUTOS EXCLUSIVOS (POV) 💎</h1>

    <!-- 1. BARRA DE PESQUISA -->
    <div class="container-pesquisa">
        <div class="campo-pesquisa">
            <span>🔍</span>
            <input type="text" id="input-buscar" placeholder="Pesquisar por modelo ou produto..." onkeyup="filtrarProdutos()">
        </div>
    </div>

    <!-- GRADE DINÂMICA COM OS 100 MODELOS -->
    <div class="grade-produtos" id="lista-de-produtos">
        <!-- O script abaixo vai construir e injetar os 100 modelos aqui dentro automaticamente -->
    </div>

    <!-- CONFIGURAÇÕES E MOTORES DO MINI APP (JAVASCRIPT) -->
    <script>
        // CONFIGURAÇÃO CENTRAL: Cole o seu WhatsApp com o código do país (55) na frente
        const CONFIG_WHATSAPP = "5511999999999"; 

        // CONFIGURAÇÃO CENTRAL: Cole a sua Chave PIX Real ou Código Copia e Cola aqui
        const CONFIG_CHAVE_PIX = "SUA_CHAVE_PIX_AQUI_OU_COPIA_E_COLA";

        // LISTA DOS 100 MODELOS (Simulação automatizada para o arquivo ficar leve)
        const listaProdutos = [];
        for (let i = 1; i <= 100; i++) {
            // Define nomes de exemplo usando termos comuns de busca (Relógio, Tênis, Phone) para testar a lupa
            let nomeItem = `Modelo #${String(i).padStart(2, '0')}`;
            if (i % 3 === 1) nomeItem += " - Relógio de Luxo Premium POV";
            if (i % 3 === 2) nomeItem += " - Tênis Streetwear Urbano POV";
            if (i % 3 === 0) nomeItem += " - Fone de Ouvido Wireless POV";

            listaProdutos.push({
                id: `prod-video-${i}`,
                idInput: `pix-input-${i}`,
                titulo: nomeItem,
                descricao: `Criativo vertical de alta conversão gravado em altíssima definição (HD). O material oficial acompanha o arquivo limpo para postagem imediata e o link do fornecedor verificado.`,
                preco: "R$ 9,90",
                // Link de teste padrão do Firebase para renderizar os players verticais de exemplo
                videoUrl: "https://googleapis.com"
            });
        }

        // FUNÇÃO QUE INJETA OS 100 PRODUTOS NA TELA
        const container = document.getElementById('lista-de-produtos');
        listaProdutos.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'card-produto';
            card.id = prod.id;
            card.innerHTML = `
                <div class="tela-compra">
                    <div class="video-container">
                        <video src="${prod.videoUrl}" preload="none" controls controlsList="nodownload" oncontextmenu="return false;"></video>
                    </div>
                    <div class="detalhes">
                        <h3>${prod.titulo}</h3>
                        <p>${prod.descricao}</p>
                        <span class="preco">${prod.preco}</span>
                    </div>
                    <div class="checkout-pix">
                        <p class="instrucao-pix">COPIE O CÓDIGO PIX ABAIXO PARA GARANTIR O ACESSO:</p>
                        <input type="text" value="${CONFIG_CHAVE_PIX}" id="${prod.idInput}" readonly class="input-pix">
                        <button onclick="copiarPix('${prod.idInput}')" class="btn-copiar">📋 Copiar Código PIX</button>
                        <button onclick="gerarCodigoSecreto('${prod.titulo.replace(/[^a-zA-Z0-9]/g, '_')}', '${prod.id}')" class="btn-paguei">⚡ Já fiz o PIX! Liberar Código</button>
                    </div>
                </div>
                <div class="tela-sucesso" style="display: none;">
                    <span style="font-size: 36px;">🔑</span>
                    <h2 style="font-size: 20px; color: #32bcad; margin-bottom: 8px;">CÓDIGO GERADO!</h2>
                    <p style="font-size: 13px; color: #bbb; line-height: 1.4;">Envie este <b>Código Secreto</b> exclusivo no suporte do WhatsApp junto com o comprovante para receber o arquivo HD original imediatamente:</p>
                    <div class="codigo-secreto-exibir"></div>
                    <a href="#" target="_blank" class="btn-whatsapp-suporte">📱 Enviar Código Secreto via WhatsApp</a>
                </div>
            `;
            container.appendChild(card);
        });
