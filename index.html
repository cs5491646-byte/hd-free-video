<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 HD VIDEOS POV</title>
    <style>
        /* ESTILO VISUAL PREMIUM (TEMA ESCURO) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TÍTULO EM AZUL EXATO */
        .titulo-pagina {
            color: #2488ff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* BARRA DE PESQUISA (LUPA) */
        .container-pesquisa {
            width: 100%;
            max-width: 450px;
            position: relative;
            margin-bottom: 20px;
        }

        .input-pesquisa {
            width: 100%;
            background-color: #0f1115;
            border: 1px solid #1c1f26;
            border-radius: 25px;
            padding: 12px 15px 12px 45px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .input-pesquisa::placeholder {
            color: #565e6d;
        }

        .icone-lupa {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #565e6d;
        }

        /* RESULTADOS ENCONTRADOS */
        .contador-videos {
            width: 100%;
            max-width: 450px;
            font-size: 13px;
            color: #565e6d;
            margin-bottom: 10px;
            padding-left: 5px;
        }

        /* CONTAINER DOS PRODUTOS */
        .lista-produtos {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* CARD DO VÍDEO COMPACTO E ORGANIZADO */
        .card-video {
            background-color: #0d0e12;
            border: 1px solid #1c1f2a;
            border-radius: 18px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* FORMATO VERTICAL 9:16 (TIKTOK/REELS) */
        .video-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #16181f;
            aspect-ratio: 9 / 16;
            max-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .titulo-video {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.3;
        }

        .descricao-video {
            font-size: 13px;
            color: #8a8f98;
            line-height: 1.4;
        }

        /* RODAPÉ (PREÇO E BOTÃO) */
        .rodape-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .preco-video {
            color: #39cc6c;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-comprar {
            background-color: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn-comprar:hover {
            background-color: #155cb4;
        }
    </style>
</head>
<body>

    <!-- TÍTULO DA PÁGINA -->
    <div class="titulo-pagina">PRODUTOS EXCLUSIVOS (POV) 💎</div>

    <!-- BARRA DE PESQUISA -->
    <div class="container-pesquisa">
        <span class="icone-lupa">🔍</span>
        <input type="text" id="campoPesquisa" class="input-pesquisa" placeholder="Pesquisar por modelo ou produto...">
    </div>

    <!-- CONTADOR DE VÍDEOS -->
    <div id="contador" class="contador-videos">Mostrando 100 vídeos</div>

    <!-- CONTAINER ONDE OS 100 VÍDEOS VÃO ENTRAR -->
    <div class="lista-produtos" id="listaProdutos"></div>

    <script>
        // Modelos de produtos reais pedidos por você para simular a lista
        const modelosBase = [
            { titulo: "Vídeo POV - Relógio de Luxo Prata", desc: "Gravação exclusiva focada nos reflexos do mostrador de safira e pulseira de aço inoxidável. Ideal para dropshipping.", preco: "R\$ 9,90" },
            { titulo: "Vídeo POV - Pijama Cetim Confort", desc: "Estilo estúdio POV mostrando o caimento perfeito, suavidade e brilho do tecido premium. Ótimo para anúncios.", preco: "R\$ 14,90" },
            { titulo: "Vídeo POV - Cueca Boxer Seamless", desc: "Detalhes das costuras reforçadas e elasticidade do tecido tecnológico microfibra em alta definição.", preco: "R\$ 7,90" },
            { titulo: "Vídeo POV - Sandália Flatform Verão", desc: "Foco nos detalhes do acabamento artesanal, textura das tiras e flexibilidade do solado.", preco: "R\$ 12,90" },
            { titulo: "Vídeo POV - Tênis Streetwear Sport", desc: "Gravação dinâmica em ambiente urbano evidenciando os detalhes de design moderno e amortecimento.", preco: "R\$ 19,90" }
        ];

        const container = document.getElementById('listaProdutos');

        // Loop inteligente para criar exatamente 100 cards variados com os produtos acima
        for (let i = 1; i <= 100; i++) {
            const modelo = modelosBase[(i - 1) % modelosBase.length];
            
            const card = document.createElement('div');
            card.className = 'card-video';
            card.innerHTML = `
                <div class="video-container">
                    <!-- Vídeo de teste leve para não travar o seu app durante a simulação -->
                    <video controls playsinline preload="metadata" loop muted>
                        <source src="https://mixkit.co" type="video/mp4">
                    </video>
                </div>
                <div class="titulo-video">#${i} ${modelo.titulo}</div>
                <div class="descricao-video">${modelo.desc} Este é o vídeo de teste número ${i} da sua galeria de fornecedores.</div>
                <div class="rodape-card">
                    <div class="preco-video">${modelo.preco}</div>
                    <a href="#" class="btn-comprar" onclick="alert('Simulação de compra do vídeo #${i}')">Comprar Vídeo</a>
                </div>
            `;
            container.appendChild(card);
        }

        // SISTEMA DE BUSCA DA LUPA EM TEMPO REAL
        const campoPesquisa = document.getElementById('campoPesquisa');
        const contador = document.getElementById('contador');

        campoPesquisa.addEventListener('input', function() {
            const termo = campoPesquisa.value.toLowerCase();
            const cardsHtml = document.querySelectorAll('.card-video');
            let encontrados = 0;

            cardsHtml.forEach(card => {
                const titulo = card.querySelector('.titulo-video').textContent.toLowerCase();
                const descricao = card.querySelector('.descricao-video').textContent.toLowerCase();

                if (titulo.includes(termo) || descricao.includes(termo)) {
                    card.style.display = 'flex';
                    encontrados++;
                } else {
                    card.style.display = 'none';
                }
            });

            contador.textContent = `Mostrando ${encontrados} vídeo(s) encontrado(s)`;
        });
    </script>

</body>
</html>
